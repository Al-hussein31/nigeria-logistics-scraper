name: Scrape USA Event Planners - Parallel

on:
  workflow_dispatch:
    inputs:
      cities:
        description: 'Comma-separated cities (empty = all Tier 1)'
        required: false
        default: 'miami_fl,atlanta_ga,las_vegas_nv,orlando_fl,new_york_ny'
      max_parallel:
        description: 'Max parallel jobs (GitHub limit varies by plan)'
        required: false
        default: '5'

jobs:
  scrape-city:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        city: [miami_fl, atlanta_ga, las_vegas_nv, orlando_fl, new_york_ny]
      max-parallel: 5

    steps:
      - uses: actions/checkout@v4

      - name: Create query file for ${{ matrix.city }}
        run: |
          python3 -c "
import math
from pathlib import Path

CITIES = {
    'miami_fl': {'name': 'Miami, FL', 'bbox': (-80.3197600, 25.7090517, -80.1391570, 25.8557827)},
    'atlanta_ga': {'name': 'Atlanta, GA', 'bbox': (-84.5508540, 33.6479187, -84.2895600, 33.8868230)},
    'las_vegas_nv': {'name': 'Las Vegas, NV', 'bbox': (-115.4065750, 36.1295540, -115.0620660, 36.4014810)},
    'orlando_fl': {'name': 'Orlando, FL', 'bbox': (-81.5075377, 28.3480634, -81.1241435, 28.6142830)},
    'new_york_ny': {'name': 'New York, NY', 'bbox': (-74.2588430, 40.4765780, -73.7002330, 40.9176300)},
}

QUERIES = [
    'event planners', 'event organizers', 'event management companies',
    'corporate event planning', 'wedding planners', 'conference organizers',
    'trade show organizers', 'event production companies', 'meeting planners',
    'festival organizers', 'event venues', 'event spaces rental',
    'corporate event venues', 'convention services', 'exhibition organizers',
]

CELL_SIZE_KM = 1.0
BATCH_SIZE = 100

city = CITIES['${{ matrix.city }}']
minLat, minLon, maxLat, maxLon = city['bbox']
center_lat = (minLat + maxLat) / 2
lat_step = CELL_SIZE_KM / 111.0
lon_step = CELL_SIZE_KM / (111.0 * math.cos(math.radians(center_lat)))

cells = []
lat = minLat + lat_step / 2
while lat < maxLat:
    lon = minLon + lon_step / 2
    while lon < maxLon:
        cells.append((round(lat, 6), round(lon, 6)))
        lon += lon_step
    lat += lat_step

print(f'{city[\"name\"]}: {len(cells)} cells')

Path('city_queries').mkdir(exist_ok=True)
with open(f'city_queries/${{ matrix.city }}.txt', 'w') as f:
    for lat, lon in cells:
        for q in QUERIES:
            f.write(f'{q} {city[\"name\"]} @{lat},{lon}\n')
          "

      - name: Run scraper with email extraction
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            gosom/google-maps-scraper \
            -input "/data/city_queries/${{ matrix.city }}.txt" \
            -results "/data/city_results/${{ matrix.city }}.csv" \
            -depth 5 \
            -c 2 \
            -email \
            -exit-on-inactivity 30m \
            -zoom 16

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.city }}-results
          path: city_results/${{ matrix.city }}.csv
          retention-days: 7
          if-no-files-found: ignore

  merge-results:
    needs: scrape-city
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: artifacts/
          merge-multiple: true

      - name: Merge and deduplicate (USA Events)
        run: python3 scripts/merge_usa_results.py

      - name: Upload master (all leads)
        uses: actions/upload-artifact@v4
        with:
          name: master-leads-all
          path: master_leads_all.csv
          retention-days: 30

      - name: Upload master (with website)
        uses: actions/upload-artifact@v4
        with:
          name: master-leads-with-website
          path: master_leads_with_website.csv
          retention-days: 30

      - name: Upload master (with email)
        uses: actions/upload-artifact@v4
        with:
          name: master-leads-with-email
          path: master_leads_with_email.csv
          retention-days: 30

      - name: Commit master to repo
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add master_leads_all.csv master_leads_with_website.csv master_leads_with_email.csv
          git commit -m "Update USA event planners master leads [skip ci]" || echo "No changes"
          git push || echo "Push failed"