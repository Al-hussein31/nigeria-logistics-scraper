name: Scrape USA Event Planners - Quick

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Single city to test (empty = miami_fl)'
        required: false
        default: 'miami_fl'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create query file (3 queries only)
        run: |
          python3 << 'EOF'
import math
CITIES = {
    'miami_fl': {'name': 'Miami, FL', 'bbox': (-80.3197600, 25.7090517, -80.1391570, 25.8557827)},
    'atlanta_ga': {'name': 'Atlanta, GA', 'bbox': (-84.5508540, 33.6479187, -84.2895600, 33.8868230)},
    'las_vegas_nv': {'name': 'Las Vegas, NV', 'bbox': (-115.4065750, 36.1295540, -115.0620660, 36.4014810)},
    'orlando_fl': {'name': 'Orlando, FL', 'bbox': (-81.5075377, 28.3480634, -81.1241435, 28.6142830)},
    'new_york_ny': {'name': 'New York, NY', 'bbox': (-74.2588430, 40.4765780, -73.7002330, 40.9176300)},
}
city_key = '${{ github.event.inputs.city }}'
city = CITIES.get(city_key, CITIES['miami_fl'])
queries = ['event planners', 'event organizers', 'wedding planners']
minLat, minLon, maxLat, maxLon = city['bbox']
center_lat = (minLat + maxLat) / 2
cell_size = 1.0
lat_step = cell_size / 111.0
lon_step = cell_size / (111.0 * math.cos(math.radians(center_lat)))
cells = []
lat = minLat + lat_step / 2
while lat < maxLat:
    lon = minLon + lon_step / 2
    while lon < maxLon:
        cells.append((round(lat, 6), round(lon, 6)))
        lon += lon_step
    lat += lat_step
with open(f'city_queries/{city_key}.txt', 'w') as f:
    for lat, lon in cells[:30]:  # Only first 30 cells
        for q in queries:
            f.write(f'{q} {city["name"]} @{lat},{lon}\n')
print(f'Created {len(cells[:30])} cells × {len(queries)} queries = {len(cells[:30])*len(queries)} lines')
EOF

      - name: Run scraper (fast)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            gosom/google-maps-scraper \
            -input "/data/city_queries/${{ github.event.inputs.city }}.txt" \
            -results "/data/city_results/${{ github.event.inputs.city }}.csv" \
            -depth 2 \
            -c 4 \
            -pages-per-browser 2 \
            -zoom 16 \
            -exit-on-inactivity 15m

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.city }}-results
          path: city_results/${{ github.event.inputs.city }}.csv
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        run: |
          if [ -f city_results/${{ github.event.inputs.city }}.csv ]; then
            python3 -c "
import pandas as pd
df = pd.read_csv('city_results/${{ github.event.inputs.city }}.csv')
print(f'Total: {len(df)}')
print(f'With website: {df[\"website\"].notna().sum()}')
print(f'With emails: {df[\"emails\"].notna().sum()}')
"
          fi