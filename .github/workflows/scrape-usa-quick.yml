name: Scrape USA Event Planners - Quick

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Single city to test'
        required: false
        default: 'miami_fl'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Create query file (3 queries, 30 cells)
        run: python3 scripts/create_usa_quick.py ${{ github.event.inputs.city }}

      - name: Run scraper with email extraction
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            gosom/google-maps-scraper \
            -input "/data/city_queries/${{ github.event.inputs.city }}.txt" \
            -results "/data/city_results/${{ github.event.inputs.city }}.csv" \
            -depth 2 \
            -c 4 \
            -pages-per-browser 2 \
            -zoom 16 \
            -email \
            -exit-on-inactivity 20m
        timeout-minutes: 30

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.city }}-results
          path: city_results/${{ github.event.inputs.city }}.csv
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          pip install pandas -q
          python3 scripts/summarize_results.py ${{ github.event.inputs.city }}