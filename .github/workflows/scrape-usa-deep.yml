name: Scrape USA Event Planners - Deep Mode

on:
  workflow_dispatch:
    inputs:
      cities:
        description: 'Comma-separated city keys (blank = all)'
        required: false
        default: 'miami_fl,atlanta_ga,las_vegas_nv,orlando_fl,new_york_ny'
      cells:
        description: 'Grid cells per city (coverage vs runtime). 32 is a good default; 6 for a smoke test.'
        required: false
        default: '32'

# Required so the merge job can push the updated master CSVs back to main.
permissions:
  contents: write

env:
  # Native ARM64 build of gosom/google-maps-scraper. The upstream amd64 image
  # runs under qemu on the OCI A1 and never completes a job.
  SCRAPER_IMAGE: google-maps-scraper:arm64

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cities: ${{ steps.parse.outputs.cities }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        env:
          RAW: ${{ inputs.cities }}
        run: |
          VALID="$(python3 scripts/create_usa_deep.py --list)"
          export VALID
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json
          valid = os.environ['VALID'].split(',')
          raw = (os.environ.get('RAW') or '').strip()
          chosen = [c.strip() for c in raw.split(',') if c.strip() in valid]
          print('cities=' + json.dumps(chosen or valid))
          PY

  scrape-city:
    needs: prepare
    runs-on: [self-hosted, linux, arm64, scraper]
    # ~10 jobs/min on 2 OCPU. A full city is a multi-hour job.
    timeout-minutes: 320
    strategy:
      fail-fast: false
      # The box is CPU-bound (2 OCPU), so parallel jobs do not increase total
      # throughput, they only split it. Keep this at 1 to protect the
      # production services co-hosted on the same VM.
      max-parallel: 1
      matrix:
        city: ${{ fromJSON(needs.prepare.outputs.cities) }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify scraper image
        run: |
          docker image inspect "${SCRAPER_IMAGE}" >/dev/null 2>&1 || {
            echo "::error::Image ${SCRAPER_IMAGE} not found on this host."
            echo "Build it once with:"
            echo "  git clone --depth 1 https://github.com/gosom/google-maps-scraper.git /tmp/gms-build"
            echo "  cd /tmp/gms-build && docker build -t ${SCRAPER_IMAGE} ."
            exit 1
          }

      - name: Scrape city
        env:
          CITY: ${{ matrix.city }}
          CELLS: ${{ inputs.cells }}
        run: |
          set -euo pipefail

          python3 scripts/create_usa_deep.py "${CITY}" --cells "${CELLS}" --print

          # Load GRID_BBOX / GRID_CELL / ZOOM produced by the generator.
          set -a
          . "city_queries/${CITY}_grid.env"
          set +a

          # /tmp is bind-mounted from the host into the runner containers, so
          # the host docker daemon can read files written here. Namespaced by
          # run id + city to avoid collisions.
          SHARED="/tmp/leads-scrape/${GITHUB_RUN_ID}/${CITY}"
          rm -rf "${SHARED}"
          mkdir -p "${SHARED}/results"
          cp "city_queries/${CITY}_terms.txt" "${SHARED}/terms.txt"

          echo "=== ${SCRAPER_IMAGE} | ${CITY_NAME} ==="
          echo "  grid  : ${GRID_CELL} km cells @ zoom ${ZOOM}"
          echo "  bbox  : ${GRID_BBOX}"
          echo "  terms : ${TERMS} x ~${CELLS} cells"

          # Geography goes through -grid-bbox/-grid-cell. This is the ONLY
          # mechanism that applies coordinates; an "@lat,lng" suffix on a query
          # line is treated as literal search text.
          docker run --rm \
            --memory 3g \
            -v "${SHARED}:/data" \
            "${SCRAPER_IMAGE}" \
            -input "/data/terms.txt" \
            -results "/data/results/${CITY}_deep.csv" \
            -grid-bbox "${GRID_BBOX}" \
            -grid-cell "${GRID_CELL}" \
            -zoom "${ZOOM}" \
            -depth 3 \
            -c 3 \
            -pages-per-browser 2 \
            -email \
            -exit-on-inactivity 15m
        timeout-minutes: 300

      - name: Copy results back
        if: always()
        env:
          CITY: ${{ matrix.city }}
        run: |
          SHARED="/tmp/leads-scrape/${GITHUB_RUN_ID}/${CITY}"
          mkdir -p city_results
          if [ -f "${SHARED}/results/${CITY}_deep.csv" ]; then
            cp "${SHARED}/results/${CITY}_deep.csv" "city_results/${CITY}_deep.csv"
            echo "Copied $(wc -l < "city_results/${CITY}_deep.csv") lines"
          else
            echo "::warning::No results file produced for ${CITY}"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.city }}-deep-results
          path: city_results/${{ matrix.city }}_deep.csv
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        env:
          CITY: ${{ matrix.city }}
        run: |
          pip install pandas -q --break-system-packages 2>/dev/null || pip install pandas -q 2>/dev/null || true
          python3 scripts/summarize_results.py "${CITY}_deep" || true

      - name: Cleanup shared temp
        if: always()
        env:
          CITY: ${{ matrix.city }}
        run: rm -rf "/tmp/leads-scrape/${GITHUB_RUN_ID}/${CITY}"

  merge-results:
    needs: scrape-city
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: pip install pandas -q
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-deep-results"
          path: artifacts/
          merge-multiple: true
      - name: Merge deep results
        run: |
          ls -la artifacts/ || true
          python3 scripts/merge_deep_results.py
      - name: Upload master (all)
        uses: actions/upload-artifact@v4
        with:
          name: master-leads-all
          path: master_leads_all.csv
          retention-days: 30
      - name: Upload master (with website)
        uses: actions/upload-artifact@v4
        with:
          name: master-leads-with-website
          path: master_leads_with_website.csv
          retention-days: 30
      - name: Upload master (with email)
        uses: actions/upload-artifact@v4
        with:
          name: master-leads-with-email
          path: master_leads_with_email.csv
          retention-days: 30
      - name: Commit to repo
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add master_leads_all.csv master_leads_with_website.csv master_leads_with_email.csv
          git commit -m "Add deep mode leads [skip ci]" || echo "No changes"
          git push
