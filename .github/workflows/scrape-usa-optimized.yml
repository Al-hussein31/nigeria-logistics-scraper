name: Scrape USA Event Planners - Optimized

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: true
        default: 'quick'
        type: choice
        options:
          - quick
          - deep
      max_parallel:
        description: 'Max parallel jobs'
        required: false
        default: '5'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate city matrix
        id: gen
        run: |
          python3 scripts/gha_generate_matrix.py ${{ github.event.inputs.mode }} "" | jq -c . > matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  scrape-city:
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      max-parallel: ${{ github.event.inputs.max_parallel }}
    steps:
      - uses: actions/checkout@v4

      - name: Create query file
        run: python3 scripts/gha_create_queries.py ${{ matrix.key }} ${{ github.event.inputs.mode }}

      - name: Run scraper (optimized)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            gosom/google-maps-scraper \
            -input "/data/city_queries/${{ matrix.key }}.txt" \
            -results "/data/city_results/${{ matrix.key }}.csv" \
            -depth 3 \
            -c 8 \
            -pages-per-browser 4 \
            -zoom 16 \
            -exit-on-inactivity 45m
        timeout-minutes: 55

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}-results
          path: city_results/${{ matrix.key }}.csv
          retention-days: 7
          if-no-files-found: ignore

  merge-results:
    needs: [generate-matrix, scrape-city]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - run: pip install pandas
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: artifacts/
          merge-multiple: true
      - name: Merge results
        run: python3 scripts/gha_merge_results.py
      - name: Upload master (all)
        uses: actions/upload-artifact@v4
        with:
          name: master-leads-all
          path: master_leads_all.csv
          retention-days: 30
      - name: Upload master (with website)
        uses: actions/upload-artifact@v4
        with:
          name: master-leads-with-website
          path: master_leads_with_website.csv
          retention-days: 30
      - name: Upload master (with email)
        uses: actions/upload-artifact@v4
        with:
          name: master-leads-with-email
          path: master_leads_with_email.csv
          retention-days: 30
      - name: Commit to repo
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add master_leads_all.csv master_leads_with_website.csv master_leads_with_email.csv
          git commit -m "Update USA event planners: ${{ needs.generate-matrix.outputs.matrix | fromJson | length }} cities, ${{ github.event.inputs.mode }} mode [skip ci]" || echo "No changes"
          git push || echo "Push failed"