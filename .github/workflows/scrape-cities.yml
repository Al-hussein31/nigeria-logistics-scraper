name: Scrape Nigerian Cities - Parallel

on:
  workflow_dispatch:
    inputs:
      cities:
        description: 'Comma-separated cities (empty = all)'
        required: false
        default: ''

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate city matrix
        id: set-matrix
        run: |
          CITIES=(
            "lagos"
            "port_harcourt"
            "kano"
            "ibadan"
            "kaduna"
            "enugu"
            "benin_city"
            "aba"
            "onitsha"
            "owerri"
            "warri"
            "calabar"
            "jos"
            "maiduguri"
            "sokoto"
            "zaria"
            "ilorin"
            "abeokuta"
            "akure"
            "uyo"
          )

          if [[ -n "${{ github.event.inputs.cities }}" ]]; then
            FILTER="${{ github.event.inputs.cities }}"
            FILTERED=()
            for c in "${CITIES[@]}"; do
              if [[ "$FILTER" == *"$c"* ]]; then
                FILTERED+=("$c")
              fi
            done
            CITIES=("${FILTERED[@]}")
          fi

          MATRIX='{"city":['
          for c in "${CITIES[@]}"; do
            MATRIX+="\"$c\","
          done
          MATRIX="${MATRIX%,}]}"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  scrape-city:
    needs: generate-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      max-parallel: 5

    steps:
      - uses: actions/checkout@v4

      - name: Run scraper
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/data" \
            gosom/google-maps-scraper \
            -input "/data/city_queries/${{ matrix.city }}.txt" \
            -results "/data/city_results/${{ matrix.city }}.csv" \
            -depth 5 \
            -c 2 \
            -exit-on-inactivity 20m \
            -zoom 15

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.city }}-results
          path: city_results/${{ matrix.city }}.csv
          retention-days: 7
          if-no-files-found: ignore

  merge-results:
    needs: [generate-matrix, scrape-city]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: artifacts/
          merge-multiple: true

      - name: Merge and deduplicate
        run: python3 scripts/merge_results.py

      - name: Upload master
        uses: actions/upload-artifact@v4
        with:
          name: master-leads
          path: master_leads.csv
          retention-days: 30

      - name: Commit master to repo
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add master_leads.csv
          git commit -m "Update master leads [skip ci]" || echo "No changes"
          git push || echo "Push failed"
